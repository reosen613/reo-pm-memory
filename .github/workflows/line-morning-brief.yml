name: LINE Morning Brief

on:
  schedule:
    # 7:30 JST (= 22:30 UTC prev day) 平日のみ
    # 06:53 JST にclaude.ai cronが briefs/buyside/morning-*.md を push する想定
    - cron: '30 22 * * 0-4'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send morning brief to LINE
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER: ${{ secrets.LINE_USER_ID }}
        run: python scripts/send_morning_brief_to_line.py

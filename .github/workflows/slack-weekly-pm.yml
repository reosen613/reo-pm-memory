name: Slack Weekly PM

# 2026-10-17 Reo: 週次PMの投稿は示唆が薄いので停止（手動実行のみ残す）
on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send weekly PM to Slack #weekly-pm
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_WEEKLY }}
        run: python scripts/send_weekly_pm_to_slack.py
